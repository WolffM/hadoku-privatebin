# nginx limits for PrivateBin — mounted at /etc/nginx/server.d/privatebin.conf.
#
# server.d is an extension hook the upstream image provides for exactly this
# (`include /etc/nginx/server.d/*.conf;` at the end of its server block), so no
# upstream file is replaced.
#
# It has to be server-level, not http-level: nginx.conf already sets
# client_max_body_size at http scope, and a second one in the same context is a
# duplicate-directive startup FAILURE, not an override. Server scope nests
# inside it and wins cleanly.
#
# The stock value is 15M — under the 16 MiB sizelimit in conf.php, so without
# this a full-size paste dies as a bare 413 with no message after the browser
# has already spent the time encrypting it.
client_max_body_size 20m;

# The body is a single JSON POST that PHP reads whole. Buffering it to disk
# rather than rejecting it is what makes the large end of the range work.
client_body_buffer_size 256k;
