; PHP limits for PrivateBin — mounted at /etc/php/conf.d/zz-privatebin.ini.
;
; The `zz-` prefix is load-bearing: conf.d files are applied in lexical order
; after php.ini, so this has to sort last to win. And the path is /etc/php, not
; /etc/php85 — in this image /etc/php85 is the SYMLINK and /etc/php is the real
; directory, so the unversioned path is the one that survives a PHP major bump.
; Mounting the versioned path would silently become a no-op on the next image
; upgrade, and the failure mode is uploads breaking at 8M with no clue why.
;
; These must agree with `sizelimit` (16 MiB) in conf.php and with
; client_max_body_size in nginx-limits.conf. Stock values in this image are
; post_max_size=8M and upload_max_filesize=2M — both far below sizelimit, which
; would reject a large paste at the PHP layer before PrivateBin ever ran.

; Headroom over the 16 MiB sizelimit for the JSON envelope the ciphertext rides
; in (adata, meta, field names). The ciphertext itself is what sizelimit caps.
post_max_size = 20M

; PrivateBin posts JSON, not multipart — attachments are base64'd into the paste
; body — so this is not on the upload path. Kept consistent anyway so the file
; does not read as if one limit was forgotten.
upload_max_filesize = 20M

; Roughly 2x the payload plus baseline. PHP holds the request body and the
; decoded string at once; too low and a large upload dies as an OOM rather than
; as the clean "Document is limited to N" message PrivateBin would otherwise
; return. The image default (128M) already clears this — pinned so a future
; image lowering it cannot quietly break uploads.
memory_limit = 128M
